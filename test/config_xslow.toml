# 条件 X-slow: 内部軸を速く、外部軸を鈍く（軸非対称の反応性）
#   message_space は baseline（test/config.toml）のまま変更しない（δ_S=δ_X=0.6, s̄_S=s̄_X=0.125）。
#   内部軸: beta=0.4, gamma=0.30 → n_max = beta*T = 2.0（T=5）、alpha = gamma/(beta-gamma) = 3.0
#   外部軸: beta=1.4, gamma=1.05 → n_max = 7.0、alpha = 3.0
#   （n_max = beta*T = 最大必要ラウンド数、alpha = gamma/(beta-gamma) = 反応性分布の裾の重さ）
# 狙い: 内部軸（リーチ構築）は即座に完成し、外部軸（変換）だけが蓄積を要する状態を作る。
#   「拡散多め→外部寄り」という系列順序効果が、s̄・δ_X だけでなく反応性パラメータ（beta/gamma）
#   を動かしても一貫して成り立つかを検証する最後のピース。
#   予測: リーチはR1〜2で完成し尽くすため、外部行動の蓄積が必要な分だけ順序効果が拡大するはず。
message_space = [
{ internal_stimulus = 0.20, external_stimulus = 0.05},
{ internal_stimulus = 0.15, external_stimulus = 0.10},
{ internal_stimulus = 0.10, external_stimulus = 0.15},
{ internal_stimulus = 0.05, external_stimulus = 0.20},
]
num_rounds = 5
receipt_probability = 0.5
internal_parameters = { beta = 0.4, gamma = 0.30, initial_utility = -1.0 }
external_parameters = { beta = 1.4, gamma = 1.05, initial_utility = -1.0 }
graph = { path = "ENGB_edges.csv", directed = true, transposed = true, format = "csv" }
ip_sampling = { size = 16, seed = 0 }
user_sampling = { size = 32, seed = 0 }
diffusion_sample_size = 100
