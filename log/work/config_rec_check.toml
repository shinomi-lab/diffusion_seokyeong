message_space = [
{ internal_stimulus = 0.20, external_stimulus = 0.05}, 
{ internal_stimulus = 0.15, external_stimulus = 0.10},
{ internal_stimulus = 0.10, external_stimulus = 0.15}, 
{ internal_stimulus = 0.05, external_stimulus = 0.20}, 
] 
num_rounds = 2
receipt_probability = 0.5
internal_parameters = { beta = 0.8, gamma = 0.6, initial_utility = -1.0 }
external_parameters = { beta = 0.8, gamma = 0.6, initial_utility = -1.0 }
graph = { path = "test/musae_ENGB_edges.csv", directed = true, transposed = true,format="csv"}
ip_sampling = { size = 1, seed = 0 }
user_sampling = { size = 1, seed = 0 }
diffusion_sample_size = 5

# 推薦チャネル（Rモデル）。表ごと消すと推薦なし（config.toml と同じ結果）。
# 定義は ../reccomend_system/推薦システム単純.md の3節、各キーは 研究リソースとか/推薦チャネル_実装仕様.md。
[recommender]
eps = 1.0       # 推薦の強さ ε（0 で推薦なし）
delta = 1.0     # フォロー外の露出の割引 δ（1 で割引なし）
theta = 0.5     # 近く（2歩先）へ推薦する確率 θ
tau = 0.0       # しきい値 τ（0 でしきい値なし）
phi_max = 3.0   # 推薦量の倍率の上限 φ_max
k = 10.0        # 擬似カウント k
mu = 1.0        # R3 のアカウント記憶 μ（1 で記憶なし）
